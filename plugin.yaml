name: claude-auto-router
version: 1.9.0
description: "Hermes adapter for durable Claude Code routing; the repository also ships a native Codex MCP adapter."
author: Karthik Thyagarajan
kind: standalone
provides_hooks:
  - pre_llm_call
  - transform_tool_result
provides_tools:
  - claude_code_dispatch
  - claude_code_message
  - claude_code_close
  - claude_code_status
  - claude_code_list
  - claude_code_restart
